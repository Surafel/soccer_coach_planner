name: Android release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - run: flutter build apk --release

      - name: Rename APK
        run: cp build/app/outputs/flutter-apk/app-release.apk soccer-coach-planner.apk

      - name: Publish latest APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest build
          body: |
            Automatically built from commit ${{ github.sha }}.

            To install: download `soccer-coach-planner.apk` on your Android phone,
            open it, and allow "install from this source" if prompted.
          make_latest: true
          files: soccer-coach-planner.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
